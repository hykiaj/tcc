<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Kids - Escolha um Avatar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a class="logo" href="index.html">Eco kids</a>
        <div class="nav-buttons">
            <a class="btn-header" href="cadastro.html">Voltar</a>
        </div>
    </header>

    <main>
        <div class="card-container" style="max-width: 650px;">
            <h1 class="card-title">Escolha um Avatar</h1>
            
            <!-- Avatares dinâmicos -->
            <div class="avatar-grid" id="avatarGrid">
                <!-- JS vai injetar aqui os avatares -->
            </div>

            <button class="btn-primary btn-green" id="btnPronto" disabled style="opacity: 0.6; cursor: not-allowed;">Pronto</button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        // Verifica login
        checkAuth();

        const grid = document.getElementById('avatarGrid');
        const btnPronto = document.getElementById('btnPronto');
        let selectedId = null;

        // Renderiza os avatares
        AVATARS.forEach(avatar => {
            const container = document.createElement('div');
            container.className = 'avatar-item';
            container.dataset.id = avatar.id;
            container.style.backgroundColor = avatar.bgColor;
            container.innerHTML = `<img src="${avatar.path}" alt="${avatar.name}">`;

            container.addEventListener('click', () => {
                // Limpa seleção
                document.querySelectorAll('.avatar-item').forEach(item => {
                    item.classList.remove('selected');
                });

                // Mostra a seleção atual
                container.classList.add('selected');
                selectedId = avatar.id;

                // Habilita o botão
                btnPronto.disabled = false;
                btnPronto.style.opacity = '1';
                btnPronto.style.cursor = 'pointer';
            });

            grid.appendChild(container);
        });

        // Salva o avatar e troca a página
        btnPronto.addEventListener('click', () => {
            if (selectedId !== null) {
                localStorage.setItem(STATE_KEYS.AVATAR_ID, selectedId.toString());
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
