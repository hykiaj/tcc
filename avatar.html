<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Kids - Escolha um Avatar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <a class="logo" href="index.html">Eco kids</a>
        <div class="nav-buttons">
            <a class="btn-header" href="cadastro.html">Voltar</a>
        </div>
    </header>

    <!-- Main Container -->
    <main>
        <div class="card-container" style="max-width: 650px;">
            <h1 class="card-title">Escolha um Avatar</h1>
            
            <!-- Grid rendered dynamically -->
            <div class="avatar-grid" id="avatarGrid">
                <!-- Avatars from JS will be injected here -->
            </div>

            <button class="btn-primary btn-green" id="btnPronto" disabled style="opacity: 0.6; cursor: not-allowed;">Pronto</button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js?v=1.0.1"></script>
    <script>
        // Check if user is registered, otherwise redirect
        checkAuth();

        const grid = document.getElementById('avatarGrid');
        const btnPronto = document.getElementById('btnPronto');
        let selectedId = null;

        // Render all the beautiful PNG avatars from auth.js
        AVATARS.forEach(avatar => {
            const container = document.createElement('div');
            container.className = 'avatar-item';
            container.dataset.id = avatar.id;
            container.style.backgroundColor = avatar.bgColor;
            container.innerHTML = `<img src="${avatar.path}" alt="${avatar.name}">`;

            container.addEventListener('click', () => {
                // Clear previous selections
                document.querySelectorAll('.avatar-item').forEach(item => {
                    item.classList.remove('selected');
                });

                // Highlight active selection
                container.classList.add('selected');
                selectedId = avatar.id;

                // Enable Pronto button
                btnPronto.disabled = false;
                btnPronto.style.opacity = '1';
                btnPronto.style.cursor = 'pointer';
            });

            grid.appendChild(container);
        });

        // Save selected avatar and move to Dashboard
        btnPronto.addEventListener('click', async () => {
            if (selectedId !== null) {
                const originalText = btnPronto.textContent;
                btnPronto.disabled = true;
                btnPronto.textContent = "Salvando...";

                try {
                    await updateAvatar(selectedId);
                    localStorage.setItem(STATE_KEYS.AVATAR_ID, selectedId.toString());
                    window.location.href = 'dashboard.html';
                } catch (err) {
                    alert("Erro ao salvar avatar: " + err.message);
                } finally {
                    btnPronto.disabled = false;
                    btnPronto.textContent = originalText;
                }
            }
        });
    </script>
</body>
</html>
